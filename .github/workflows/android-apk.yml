name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            cmake \
            libffi-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo5 \
            libtool \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Cache Android toolchains
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-Linux-1dcdc5bb68f1536344eb6d6f69bfc724a8b6373137f05c248fcddabec7239c5a

      - name: Build debug APK
        run: buildozer android debug

      - name: Verify APK architectures
        run: |
          if ! compgen -G "bin/*-arm64-v8a-debug.apk" > /dev/null; then
            echo "::error::No ARM64 debug APK was produced"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dtea-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
