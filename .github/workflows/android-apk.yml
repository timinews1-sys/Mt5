name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            cmake \
            libffi-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo5 \
            libtool \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Cache Android toolchains
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: buildozer android debug

      - name: Verify APK architectures
        run: |
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            if ! compgen -G "bin/*-${arch}-debug.apk" > /dev/null; then
              echo "::error::No debug APK was produced for ${arch}"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dtea-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
